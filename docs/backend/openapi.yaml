        in: query
        required: false
        description: 'Stays and vehicles: first night. Experiences: first day of the window.'
        schema:
          type: string
          format: date
      - name: check_out
        in: query
        required: false
        description: Exclusive end. Must be after check_in; max 90 nights.
        schema:
          type: string
          format: date
