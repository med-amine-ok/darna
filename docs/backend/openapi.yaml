      - messages
      - unread_total
      - next_cursor
      - has_more
      - poll_after_ms
      properties:
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
          description: Threads that changed since the cursor (new message, read state, mute).
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: New messages since the cursor across all my threads, oldest first, at most 200.
        unread_total:
          type: integer
        next_cursor:
          type: string
          description: Pass as `after` on the next call. Opaque.
        has_more:
          type: boolean
          description: 'True when more than 200 messages are waiting: call again at once.'
        poll_after_ms:
          type: integer
          minimum: 2000
          maximum: 60000
          description: 'Server hint: wait this long before the next poll (5 to 15 s while a thread is open).'
