paths:
  /api/v1/auth/signup:
    post:
      operationId: authSignup
      summary: Sign up with email or Algerian phone
      tags:
      - auth
      description: allauth headless signup. Creates the user and the consent records, then starts the `verify_email` or `verify_phone` flow. 409
        `email_taken` or `phone_taken`.
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-01
      - PRV-01
      x-rules:
      - BR-ACC-01
      - BR-PRV-01
      x-release: MVP
  /api/v1/auth/login:
    post:
      operationId: authLogin
      summary: Sign in with email or phone and password
      tags:
      - auth
      description: Returns the session token to the BFF. Every failure returns the same 400 `invalid_credentials`. 5 failures in 15 minutes lock
        for 60 s per account and per IP (429 `login_locked`).
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-02
      - ACC-03
      - ACC-07
      - NFR-11
      x-rules:
      - BR-ACC-02
      - BR-ACC-03
      - BR-ACC-05
      x-release: MVP
  /api/v1/auth/code/request:
    post:
      operationId: authRequestLoginCode
      summary: Send a one-time login code by SMS (phone OTP)
      tags:
      - auth
      description: allauth login-by-code. 6 digits, valid 10 minutes, max 3 sends per phone per hour and 10 per IP per hour. Always answers the
        same way, even for unknown numbers.
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-02
      - ACC-07
      x-rules:
      - BR-ACC-02
      - BR-ACC-05
      x-release: MVP
  /api/v1/auth/code/confirm:
    post:
      operationId: authConfirmLoginCode
      summary: Confirm the one-time login code
      tags:
      - auth
      description: 5 wrong attempts invalidate the code (400 `invalid_code`, same for every failure).
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeConfirm'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-02
      x-rules:
      - BR-ACC-02
      x-release: MVP
  /api/v1/auth/session:
    get:
      operationId: authGetSession
      summary: Read the current session
      tags:
      - auth
      description: Used by both BFFs on every page render (cached per request). 401 when the token is unknown, expired or revoked.
      security:
      - sessionToken: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-03
      x-rules:
      - BR-ACC-03
      x-release: MVP
    delete:
      operationId: authLogout
      summary: Sign out (revoke the session token)
      tags:
      - auth
      description: Revokes the token server-side immediately; the BFF then deletes its cookie.
      security:
      - sessionToken: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Done. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-03
      x-rules:
      - BR-ACC-03
      x-release: MVP
  /api/v1/auth/phone/verify:
    post:
      operationId: authVerifyPhone
      summary: Verify a phone number with the SMS code
      tags:
      - auth
      description: Completes `verify_phone` after signup or after PUT /me/phone. Required before the first booking (DEC-012).
      security:
      - sessionToken: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeConfirm'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-01
      - ACC-06
      x-rules:
      - BR-ACC-01
      - BR-ACC-02
      x-release: MVP
  /api/v1/auth/email/verify:
    post:
      operationId: authVerifyEmail
      summary: Verify an email address with the emailed key
      tags:
      - auth
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              properties:
                key:
                  type: string
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-01
      - ACC-06
      x-rules:
      - BR-ACC-01
      x-release: MVP
  /api/v1/auth/password/request:
    post:
      operationId: authRequestPasswordReset
      summary: Ask for a password reset (email link or SMS code)
      tags:
      - auth
      description: Always 204, even for unknown accounts.
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Done. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-04
      x-rules:
      - BR-ACC-02
      x-release: MVP
  /api/v1/auth/password/reset:
    post:
      operationId: authResetPassword
      summary: Set a new password with the reset key
      tags:
      - auth
      description: All other sessions of the user are revoked.
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-04
      x-rules:
      - BR-ACC-03
      x-release: MVP
  /api/v1/auth/password/change:
    post:
      operationId: authChangePassword
      summary: Change password (signed in)
      tags:
      - auth
      description: Needs the current password (400 `invalid_current_password`). Revokes all other sessions. Replaces the website action changePasswordAction.
      security:
      - sessionToken: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Done. No body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-04
      x-rules:
      - BR-ACC-03
      x-release: MVP
  /api/v1/auth/2fa/authenticate:
    post:
      operationId: authMfaAuthenticate
      summary: 'Second step of login: TOTP or recovery code'
      tags:
      - auth
      description: Called when the login response lists the pending flow `mfa_authenticate`. The partial session token is sent in X-Session-Token.
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaAuthenticate'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-05
      x-rules:
      - BR-ACC-04
      x-release: MVP
  /api/v1/auth/authenticators:
    get:
      operationId: authListAuthenticators
      summary: List my second factors
      tags:
      - auth
      security:
      - sessionToken: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Authenticator'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-05
      x-rules:
      - BR-ACC-04
      x-release: MVP
  /api/v1/auth/authenticators/totp:
    get:
      operationId: authGetTotpSetup
      summary: Get a TOTP secret to enrol
      tags:
      - auth
      security:
      - sessionToken: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-05
      x-rules:
      - BR-ACC-04
      x-release: MVP
    post:
      operationId: authEnrolTotp
      summary: Enrol a TOTP authenticator
      tags:
      - auth
      description: Hosts must enrol before editing payout details; staff before any admin endpoint.
      security:
      - sessionToken: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeConfirm'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Authenticator'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-requirements:
      - ACC-05
      x-rules:
      - BR-ACC-04
      x-release: MVP
  /api/v1/geo/wilayas:
    get:
      operationId: listWilayas
      summary: List the 69 wilayas
      tags:
      - public.geo
      description: Static list, cached 24 h (Cache-Control public, ETag). Codes 59 to 69 still to confirm (DEC-013).
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wilaya'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-requirements:
      - SRC-04
      x-rules:
      - BR-SRC-02
      x-release: MVP
  /api/v1/geo/wilayas/{wilaya_code}/communes:
    get:
      operationId: listWilayaCommunes
      summary: List the communes of one wilaya
      tags:
      - public.geo
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/path_wilaya_code'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Commune'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      x-requirements:
      - SRC-04
      x-rules:
      - BR-SRC-02
      x-release: MVP
  /api/v1/geo/communes:
    get:
      operationId: autocompleteCommunes
      summary: Autocomplete communes by name (fr, ar, en)
      tags:
      - public.geo
      security: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: q
        in: query
        required: true
        description: Part of the name. Accent and case insensitive, trigram match.
        schema:
          type: string
          minLength: 2
          maxLength: 80
        example: tizi
      - name: wilaya
        in: query
        required: false
        description: Limit to one wilaya.
        schema:
          type: integer
          minimum: 1
          maximum: 69
      - name: limit
        in: query
        required: false
        description: Max results.
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 10
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
