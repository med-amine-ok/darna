  responses:
    BadRequest:
      description: Malformed request (bad JSON, bad query value). Code e.g. `bad_request`, `invalid_credentials`, `invalid_code`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid session token, or the session was revoked. Code `not_authenticated`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'Signed in but not allowed. Codes: `permission_denied` (has `required_permission`), `mfa_required`, `phone_verification_required`,
        `host_offer_not_allowed`, `four_eyes_same_user`, `account_suspended`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or not visible to the caller (other host accounts look like 404 on purpose), or a dormant feature that is switched
        off. Code `not_found` or `feature_disabled`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'The request conflicts with the current state: lost a race, wrong status, duplicate, idempotency key still running. Codes e.g.
        `dates_unavailable`, `invalid_transition`, `price_changed`, `idempotency_in_progress`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: 'If-Match did not match the current ETag: someone else saved first. Reload and try again. Code `stale_version`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation failed. `errors` lists each field. Also `idempotency_key_reused` (same key, different body).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit reached. Wait for Retry-After seconds. Code `rate_limited` or `login_locked`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: Not modified since the ETag sent in If-None-Match.
  headers:
    RetryAfter:
      description: Seconds to wait.
      schema:
        type: integer
    ETag:
      description: Version of the representation, for If-None-Match or If-Match.
      schema:
        type: string
    IdempotencyReplayed:
      description: true when this is a stored response replayed for a repeated Idempotency-Key.
      schema:
        type: string
        enum:
        - 'true'
    RequestId:
      description: Correlation id, also in error bodies and logs.
      schema:
        type: string
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: django-allauth headless session token of a website user. Only the website BFF (Next.js server) holds it; the browser only has
        an httpOnly cookie that points to it. Revocable server-side; 30 days sliding (BR-ACC-03).
    staffSession:
      type: apiKey
      in: header
      name: X-Session-Token
      description: Session token from the staff login (/api/v1/admin/auth). Only the admin BFF holds it. Valid only for staff users with second
        factor verified; 8 h absolute, 30 min idle. Website tokens are refused on /api/v1/admin/* and staff tokens on host endpoints (STF-05).
    gatewaySignature:
      type: apiKey
      in: header
      name: signature
      description: HMAC-SHA256 of the raw body computed with the gateway secret (Chargily header `signature`). Checked after the raw body is stored.
