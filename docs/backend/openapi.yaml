    post:
      operationId: createBooking
      summary: Book from a quote (instant or request)
      tags:
      - me.bookings
      description: |-
        One database transaction: re-price the quote, lock inventory (exclusion constraint for single units, atomic counter update for pools and seats), resolve approval mode, create the booking with its snapshot, post the commission if confirmed, write outbox events.

        Errors: 403 `phone_verification_required`; 403 `cannot_book_own_listing`; 409 `dates_unavailable` / `not_enough_units` / `seats_unavailable` (lost the race); 409 `price_changed` (body has the new `quote`); 409 `quote_expired`; 409 `idempotency_in_progress`; 422 `idempotency_key_reused` (same key, different body).
      security:
      - sessionToken: []
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
