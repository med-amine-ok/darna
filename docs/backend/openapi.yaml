        in: query
        required: false
        description: Property type slugs.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: category
        in: query
        required: false
        description: Category slug.
        schema:
          type: string
      - name: amenities
        in: query
        required: false
        description: Amenity slugs; a listing must have all of them.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: experience_type
        in: query
        required: false
        description: Experience types (the website's `expType`). Only with vertical=experience.
