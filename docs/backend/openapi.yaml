  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 'Language of labels and error messages: en, fr or ar (default fr). The BFF forwards the user''s locale.'
      schema:
        type: string
        default: fr
        examples:
        - ar
        - fr-DZ
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Unique value per user action (UUIDv4 or v7) made by the app. Same key + same body returns the stored response (with header
        Idempotency-Replayed: true); same key + different body returns 422; while the first call still runs, 409. Kept 24 h (BR-SYS-01).'
      schema:
        type: string
        minLength: 8
        maxLength: 80
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional. Same behaviour as on create endpoints; recommended for buttons a user may click twice.
      schema:
        type: string
        minLength: 8
        maxLength: 80
    XHostAccount:
      name: X-Host-Account
      in: header
      required: false
      description: Host account the request acts for. If missing, the active host account stored in the session (PUT /me/workspaces/active) is
        used. Checked against the caller's memberships on every request; unknown or not held gives 404 (BR-ORG-01).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the last GET. Prevents lost updates (412 when stale).
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag from a previous response; 304 when nothing changed.
      schema:
