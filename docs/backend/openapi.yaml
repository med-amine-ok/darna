        in: query
        required: false
        description: Host types.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/HostType'
        style: form
        explode: false
      - name: host_account
        in: query
        required: false
        description: Only listings of one host account (public organisation or host page).
        schema:
          type: string
          format: uuid
      - name: bedrooms_min
        in: query
        required: false
        description: Minimum bedrooms.
        schema:
          type: integer
          minimum: 0
      - name: bathrooms_min
        in: query
        required: false
        description: Minimum bathrooms.
        schema:
          type: integer
          minimum: 0
      - name: min_rating
        in: query
        required: false
        description: Minimum average rating.
        schema:
          type: number
          minimum: 1
          maximum: 5
      - name: instant
        in: query
        required: false
        description: Only listings that resolve to instant booking.
        schema:
          type: boolean
      - name: featured
        in: query
        required: false
        description: Only featured listings (home page rows).
        schema:
          type: boolean
      - name: bbox
        in: query
        required: false
        description: 'Map box: min_lng,min_lat,max_lng,max_lat. Uses public points only (SRC-02).'
        schema:
          type: array
          items:
            type: number
          minItems: 4
          maxItems: 4
        style: form
        explode: false
        example:
        - 2.3
        - 36.4
        - 3.3
        - 36.9
      - name: ordering
        in: query
        required: false
        description: Sort order.
        schema:
          type: string
          enum:
          - relevance
          - price
          - -price
          - rating
          - newest
          default: relevance
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                description: 'Cursor page: pass next_cursor back as `cursor` to continue.'
                required:
                - results
