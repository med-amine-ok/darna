                - has_more
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListingCard'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  has_more:
                    type: boolean
                  total_estimate:
                    type: integer
                    description: Approximate total, for 'about N stays'.
              example:
                results:
                - id: 01933b80-1111-7aaa-8bbb-000000000001
                  reference: LST-7K2M9Q
                  vertical: home
                  experience_type: null
                  title: Villa with sea view in Tipaza
                  property_type: villa
                  commune:
                    id: 4201
                    name: Tipaza
                    wilaya_code: 42
                    wilaya_name: Tipaza
                  location_public:
                    lat: 36.5921
                    lng: 2.4433
                  cover_photo: null
                  price_from:
                    amount_minor: 1850000
                    currency: DZD
                  price_unit: night
                  rating_avg: 4.8
                  review_count: 23
                  instant_bookable: false
                  host_type: individual
                  matched_availability:
                    full_match: true
                    from: '2026-12-18'
                    to: '2026-12-21'
                  quoted_total:
                    amount_minor: 5950000
                    currency: DZD
                  is_favorite: false
                next_cursor: eyJyIjowLjkxLCJpZCI6IjAxOTMzYjgwIn0
                has_more: true
                total_estimate: 37
        '400':
