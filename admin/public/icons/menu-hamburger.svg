<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top Moorish lintel bar -->
  <line x1="3.5" y1="6.5" x2="20.5" y2="6.5" stroke="currentColor" stroke-width="1.8"/>
  <!-- Middle lintel bar with terracotta diamond terminal -->
  <line x1="3.5" y1="12" x2="16.5" y2="12" stroke="currentColor" stroke-width="1.8"/>
  <polygon points="18.5,12 20,10.7 21.5,12 20,13.3" fill="#C96F4F" stroke="#C96F4F" stroke-width="0.5"/>
  <!-- Bottom Moorish lintel bar -->
  <line x1="3.5" y1="17.5" x2="20.5" y2="17.5" stroke="currentColor" stroke-width="1.8"/>
</svg>
