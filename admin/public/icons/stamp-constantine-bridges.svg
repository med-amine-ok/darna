<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Passport stamp circular notched border -->
  <circle cx="16" cy="16" r="14.5" stroke="#D9C9B2" stroke-width="1.25" stroke-dasharray="2 1.5"/>
  <!-- Steep Rhumel Canyon gorge rock cliffs -->
  <path d="M5 26.5L8.5 20L7.5 13.5" stroke="#6B7F5B" stroke-width="1.3"/>
  <path d="M27 26.5L23.5 20L24.5 13.5" stroke="#6B7F5B" stroke-width="1.3"/>
  <!-- Monumental lower stone bridge arch spanning the gorge -->
  <path d="M9.5 25C10.5 19 21.5 19 22.5 25" stroke="#2E3A2F" stroke-width="1.5"/>
  <!-- Terracotta keystone at bridge arch apex -->
  <circle cx="16" cy="19" r="1.1" fill="#C96F4F"/>
  <!-- Suspension bridge pylon towers (Sidi M'Cid) -->
  <path d="M10 16V9H12.5V16" stroke="#2E3A2F" stroke-width="1.4"/>
  <path d="M19.5 16V9H22V16" stroke="#2E3A2F" stroke-width="1.4"/>
  <!-- Main suspension cable curve -->
  <path d="M7.5 11C11.5 15.5 20.5 15.5 24.5 11" stroke="#2E3A2F" stroke-width="1.3"/>
  <!-- Bridge roadway deck line -->
  <line x1="6" y1="16" x2="26" y2="16" stroke="#2E3A2F" stroke-width="1.5"/>
  <!-- Vertical suspension wire stays -->
  <line x1="14" y1="14" x2="14" y2="16" stroke="#6B7F5B" stroke-width="1"/>
  <line x1="16" y1="14.5" x2="16" y2="16" stroke="#6B7F5B" stroke-width="1"/>
  <line x1="18" y1="14" x2="18" y2="16" stroke="#6B7F5B" stroke-width="1"/>
</svg>
