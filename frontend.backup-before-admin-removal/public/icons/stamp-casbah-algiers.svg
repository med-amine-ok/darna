<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Passport stamp circular notched border -->
  <circle cx="16" cy="16" r="14.5" stroke="#D9C9B2" stroke-width="1.25" stroke-dasharray="2 1.5"/>
  <!-- Base street line -->
  <line x1="6" y1="25" x2="26" y2="25" stroke="#2E3A2F" stroke-width="1.5"/>
  <!-- Cascading Casbah houses & stepped rooftop terraces -->
  <path d="M7 25V17H12V14H18V17H21V25" stroke="#2E3A2F" stroke-width="1.5"/>
  <line x1="12" y1="14" x2="12" y2="25" stroke="#6B7F5B" stroke-width="1.2"/>
  <line x1="18" y1="17" x2="18" y2="25" stroke="#6B7F5B" stroke-width="1.2"/>
  <!-- Historic Moorish keyhole / horseshoe arch in center facade -->
  <path d="M13 25V20.5C13 19.4 13.8 18.5 15 18.5C16.2 18.5 17 19.4 17 20.5V25" stroke="#2E3A2F" stroke-width="1.5"/>
  <!-- Minaret tower rising above the Casbah -->
  <path d="M21 17V8H24V17" stroke="#2E3A2F" stroke-width="1.4"/>
  <path d="M20.5 8L22.5 5.5L24.5 8" stroke="#2E3A2F" stroke-width="1.4"/>
  <!-- Terracotta minaret finial crescent accent -->
  <circle cx="22.5" cy="4.2" r="1" fill="#C96F4F"/>
  <!-- Little medina window slit details -->
  <line x1="9" y1="19" x2="10" y2="19" stroke="#6B7F5B" stroke-width="1.2"/>
  <line x1="15" y1="16" x2="15" y2="16.5" stroke="#C96F4F" stroke-width="1.5"/>
</svg>
