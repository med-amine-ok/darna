<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Calendar tablet frame -->
  <rect x="3.5" y="4.5" width="17" height="16" rx="2.5" stroke="currentColor" stroke-width="1.75"/>
  <!-- Top header divider line -->
  <line x1="3.5" y1="9.5" x2="20.5" y2="9.5" stroke="currentColor" stroke-width="1.5"/>
  <!-- Top hanger binder posts -->
  <line x1="8" y1="2.5" x2="8" y2="5" stroke="currentColor" stroke-width="1.75"/>
  <line x1="16" y1="2.5" x2="16" y2="5" stroke="currentColor" stroke-width="1.75"/>
  <!-- Calendar day matrix dots with terracotta highlighted active date -->
  <circle cx="8" cy="13.5" r="1.1" fill="currentColor"/>
  <circle cx="12" cy="13.5" r="1.1" fill="currentColor"/>
  <circle cx="16" cy="13.5" r="1.3" fill="#C96F4F"/>
  <circle cx="8" cy="17" r="1.1" fill="currentColor"/>
  <circle cx="12" cy="17" r="1.1" fill="currentColor"/>
  <circle cx="16" cy="17" r="1.1" fill="currentColor"/>
</svg>
